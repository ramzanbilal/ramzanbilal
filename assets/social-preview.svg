<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101B33"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#182338" stroke-width="1"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0.5 L7 3.5 L0 6.5 Z" fill="#FBBF24"/>
    </marker>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity=".9"/>

  <!-- identity -->
  <g transform="translate(80 118)">
    <text class="mono" x="0" y="0" fill="#38BDF8" font-size="18" letter-spacing="3">// BILAL</text>
    <text class="sans" x="0" y="66" fill="#F8FAFC" font-size="56" font-weight="700">Mobile App Architect</text>
    <text class="sans" x="0" y="108" fill="#94A3B8" font-size="24">React Native · Expo · Flutter · SwiftUI · React · Node · Supabase · Firebase</text>
    <text class="mono" x="0" y="172" fill="#FBBF24" font-size="24" font-weight="600">Architecture first. Code second.</text>
    <text class="mono" x="0" y="212" fill="#64748B" font-size="17">7+ years  ·  100+ apps shipped to the App Store and Google Play</text>
  </g>

  <!-- lanes -->
  <g transform="translate(80 380)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="300" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text class="mono" x="20" y="35" fill="#64748B" font-size="19">Web app only</text>
      <path d="M312 28 H372" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
      <rect x="386" y="0" width="360" height="56" rx="8" fill="#0F1E2E" stroke="#38BDF8" stroke-width="1.8"/>
      <text class="mono" x="406" y="35" fill="#E2E8F0" font-size="19" font-weight="600">iOS + Android, native</text>
      <circle cx="728" cy="14" r="5" fill="#22C55E"/>
    </g>
    <g transform="translate(0 76)">
      <rect x="0" y="0" width="300" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text class="mono" x="20" y="35" fill="#64748B" font-size="19">AI / vibe-coded</text>
      <path d="M312 28 H372" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
      <rect x="386" y="0" width="360" height="56" rx="8" fill="#0F1E2E" stroke="#38BDF8" stroke-width="1.8"/>
      <text class="mono" x="406" y="35" fill="#E2E8F0" font-size="19" font-weight="600">Typed, tested, in CI</text>
      <circle cx="728" cy="14" r="5" fill="#22C55E"/>
    </g>
    <g transform="translate(0 152)">
      <rect x="0" y="0" width="300" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text class="mono" x="20" y="35" fill="#64748B" font-size="19">Store rejected</text>
      <path d="M312 28 H372" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
      <rect x="386" y="0" width="360" height="56" rx="8" fill="#0F1E2E" stroke="#38BDF8" stroke-width="1.8"/>
      <text class="mono" x="406" y="35" fill="#E2E8F0" font-size="19" font-weight="600">Approved and live</text>
      <circle cx="728" cy="14" r="5" fill="#22C55E"/>
    </g>
  </g>

</svg>
