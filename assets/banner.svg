<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="8+ years experience, code audits, performance optimization, architecture review and improvements. What changes when I take over: web app to native app, vibe-coded app to production-ready app, rejected app to approved and live app." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101B33"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#182338" stroke-width="1"/>
    </pattern>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0.5 L8 4 L0 7.5 Z" fill="#FBBF24"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .before { fill: #0F172A; stroke: #334155; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0;
              animation: rise .6s ease-out forwards; }
    .after  { fill: #0F1E2E; stroke: #38BDF8; stroke-width: 1.2; opacity: 0;
              animation: rise .6s ease-out forwards; }
    .arrow  { fill: none; stroke: #FBBF24; stroke-width: 1.6; stroke-linecap: round;
              stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .7s ease-out forwards; }
    .tb { fill: #94A3B8; font-size: 14px; opacity: 0; animation: rise .6s ease-out forwards; }
    .ta { fill: #E2E8F0; font-size: 14px; font-weight: 600; opacity: 0; animation: rise .6s ease-out forwards; }
    .dot { fill: #22C55E; opacity: 0; animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
    .heading { fill: #38BDF8; font-size: 13px; letter-spacing: 2px; opacity: 0; animation: rise .6s ease-out forwards; }
    .chip { fill: #0F172A; stroke: #334155; stroke-width: 1; opacity: 0; animation: rise .5s ease-out forwards; }
    .chipText { fill: #CBD5E1; font-size: 12px; opacity: 0; animation: rise .5s ease-out forwards; }

    .c1 { animation-delay: .05s } .c2 { animation-delay: .15s } .c3 { animation-delay: .25s } .c4 { animation-delay: .35s }
    .r1a { animation-delay: .65s } .r1b { animation-delay: 1.0s } .r1c { animation-delay: 1.35s } .r1d { animation-delay: 1.65s }
    .r2a { animation-delay: 1.1s } .r2b { animation-delay: 1.45s } .r2c { animation-delay: 1.8s } .r2d { animation-delay: 2.1s }
    .r3a { animation-delay: 1.55s } .r3b { animation-delay: 1.9s } .r3c { animation-delay: 2.25s } .r3d { animation-delay: 2.55s }

    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes pop  { from { opacity: 0; transform: scale(0) } to { opacity: 1; transform: scale(1) } }

    @media (prefers-reduced-motion: reduce) {
      .before, .after, .tb, .ta, .dot, .heading, .chip, .chipText { opacity: 1; animation: none; }
      .arrow { stroke-dashoffset: 0; animation: none; }
    }
  </style>

  <rect width="960" height="280" rx="14" fill="url(#bg)"/>
  <rect width="960" height="280" rx="14" fill="url(#grid)" opacity=".9"/>

  <!-- credentials strip -->
  <g transform="translate(0 18)">
    <rect class="chip c1" x="90.4" y="0" width="150.4" height="26" rx="13"/>
    <text class="chipText mono c1" x="104.4" y="17.5">8+ yrs experience</text>
    <rect class="chip c2" x="256.8" y="0" width="107.2" height="26" rx="13"/>
    <text class="chipText mono c2" x="270.8" y="17.5">Code audits</text>
    <rect class="chip c3" x="380" y="0" width="200.8" height="26" rx="13"/>
    <text class="chipText mono c3" x="394" y="17.5">Performance optimization</text>
    <rect class="chip c4" x="596.8" y="0" width="272.8" height="26" rx="13"/>
    <text class="chipText mono c4" x="610.8" y="17.5">Architecture review &amp; improvements</text>
  </g>

  <text class="mono heading" x="480" y="70" text-anchor="middle">// WHAT CHANGES WHEN I TAKE OVER</text>

  <!-- transform lanes -->
  <g transform="translate(205 96)">
    <!-- lane 1 -->
    <g transform="translate(0 0)">
      <rect class="before r1a" x="0" y="0" width="200" height="40" rx="8"/>
      <text class="tb mono r1a" x="18" y="26">Web app</text>
      <path class="arrow r1b" d="M208 20 H262" marker-end="url(#head)"/>
      <rect class="after r1c" x="272" y="0" width="278" height="40" rx="8"/>
      <text class="ta mono r1c" x="290" y="26">Native mobile app</text>
      <circle class="dot r1d" cx="530" cy="11" r="4.5"/>
    </g>
    <!-- lane 2 -->
    <g transform="translate(0 62)">
      <rect class="before r2a" x="0" y="0" width="200" height="40" rx="8"/>
      <text class="tb mono r2a" x="18" y="26">Vibe-coded app</text>
      <path class="arrow r2b" d="M208 20 H262" marker-end="url(#head)"/>
      <rect class="after r2c" x="272" y="0" width="278" height="40" rx="8"/>
      <text class="ta mono r2c" x="290" y="26">Production-ready app</text>
      <circle class="dot r2d" cx="530" cy="11" r="4.5"/>
    </g>
    <!-- lane 3 -->
    <g transform="translate(0 124)">
      <rect class="before r3a" x="0" y="0" width="200" height="40" rx="8"/>
      <text class="tb mono r3a" x="18" y="26">Rejected app</text>
      <path class="arrow r3b" d="M208 20 H262" marker-end="url(#head)"/>
      <rect class="after r3c" x="272" y="0" width="278" height="40" rx="8"/>
      <text class="ta mono r3c" x="290" y="26">Approved &amp; live app</text>
      <circle class="dot r3d" cx="530" cy="11" r="4.5"/>
    </g>
  </g>
</svg>
