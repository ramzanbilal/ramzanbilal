<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Bilal, Mobile App Architect. Web to mobile. Vibe-coded to production. Rejected to approved." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101B33"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#182338" stroke-width="1"/>
    </pattern>
    <marker id="head" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0 0.5 L6 3 L0 5.5 Z" fill="#FBBF24"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .before { fill: #0F172A; stroke: #334155; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0;
              animation: rise .6s ease-out forwards; }
    .after  { fill: #0F1E2E; stroke: #38BDF8; stroke-width: 1.2; opacity: 0;
              animation: rise .6s ease-out forwards; }
    .arrow  { fill: none; stroke: #FBBF24; stroke-width: 1.6; stroke-linecap: round;
              stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .7s ease-out forwards; }
    .tb { fill: #94A3B8; font-size: 10.5px; opacity: 0; animation: rise .6s ease-out forwards; }
    .ta { fill: #E2E8F0; font-size: 10.5px; font-weight: 600; opacity: 0; animation: rise .6s ease-out forwards; }
    .dot { fill: #22C55E; opacity: 0; animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
    .caret { fill: #38BDF8; animation: blink 1.1s step-end infinite; }

    .r1a { animation-delay: .15s } .r1b { animation-delay: .45s } .r1c { animation-delay: .75s } .r1d { animation-delay: 1.0s }
    .r2a { animation-delay: .55s } .r2b { animation-delay: .85s } .r2c { animation-delay: 1.15s } .r2d { animation-delay: 1.4s }
    .r3a { animation-delay: .95s } .r3b { animation-delay: 1.25s } .r3c { animation-delay: 1.55s } .r3d { animation-delay: 1.8s }

    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes pop  { from { opacity: 0; transform: scale(0) } to { opacity: 1; transform: scale(1) } }
    @keyframes blink { 50% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .before, .after, .tb, .ta, .dot { opacity: 1; animation: none; }
      .arrow { stroke-dashoffset: 0; animation: none; }
      .caret { animation: none; }
    }
  </style>

  <rect width="960" height="280" rx="14" fill="url(#bg)"/>
  <rect width="960" height="280" rx="14" fill="url(#grid)" opacity=".9"/>

  <!-- identity -->
  <g transform="translate(48 60)">
    <text class="mono" x="0" y="0" fill="#38BDF8" font-size="12" letter-spacing="2">// BILAL</text>
    <text class="sans" x="0" y="44" fill="#F8FAFC" font-size="33" font-weight="700">Mobile App Architect</text>
    <text class="sans" x="0" y="72" fill="#CBD5E1" font-size="14.5">React Native · Expo · Flutter · SwiftUI · React · Node</text>
    <text class="mono" x="0" y="112" fill="#CBD5E1" font-size="11.5">8+ years · 100+ apps shipped to the App Store and Google Play</text>
  </g>

  <!-- transform lanes -->
  <g transform="translate(548 52)">
    <!-- lane 1 -->
    <g transform="translate(0 0)">
      <rect class="before r1a" x="0" y="0" width="140" height="34" rx="6"/>
      <text class="tb mono r1a" x="12" y="21">Web app only</text>
      <path class="arrow r1b" d="M148 17 H186" marker-end="url(#head)"/>
      <rect class="after r1c" x="194" y="0" width="166" height="34" rx="6"/>
      <text class="ta mono r1c" x="206" y="21">iOS + Android, native</text>
      <circle class="dot r1d" cx="350" cy="9" r="3.5"/>
    </g>
    <!-- lane 2 -->
    <g transform="translate(0 52)">
      <rect class="before r2a" x="0" y="0" width="140" height="34" rx="6"/>
      <text class="tb mono r2a" x="12" y="21">AI / vibe-coded</text>
      <path class="arrow r2b" d="M148 17 H186" marker-end="url(#head)"/>
      <rect class="after r2c" x="194" y="0" width="166" height="34" rx="6"/>
      <text class="ta mono r2c" x="206" y="21">Typed, tested, in CI</text>
      <circle class="dot r2d" cx="350" cy="9" r="3.5"/>
    </g>
    <!-- lane 3 -->
    <g transform="translate(0 104)">
      <rect class="before r3a" x="0" y="0" width="140" height="34" rx="6"/>
      <text class="tb mono r3a" x="12" y="21">Store rejected</text>
      <path class="arrow r3b" d="M148 17 H186" marker-end="url(#head)"/>
      <rect class="after r3c" x="194" y="0" width="166" height="34" rx="6"/>
      <text class="ta mono r3c" x="206" y="21">Approved and live</text>
      <circle class="dot r3d" cx="350" cy="9" r="3.5"/>
    </g>
  </g>
</svg>
